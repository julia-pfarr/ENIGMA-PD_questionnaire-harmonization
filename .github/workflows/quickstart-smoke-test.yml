name: Quickstart smoke test

# Runs the score-transformation + validation pipeline end-to-end on
# synthetic data (./code/score-transformation/run_all.sh, no args -- see
# README "Testing the pipeline without real data"). This can never reproduce
# the manuscript's reported
# results (no real cohort data is available in CI), but it does catch
# breakage that a code review alone won't: missing/renamed files, broken
# CLI flags, a script silently failing on a fresh checkout, a dependency
# that isn't actually pinned correctly (see the scikit-learn upper bound in
# requirements.txt for a bug this exact kind of check would have caught).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Only what the score-transformation + validation pipeline
          # (run_all.sh's quickstart mode) actually needs -- NOT the full
          # requirements.txt, which also covers the embedding/fine-tuning
          # stack (torch, sentence-transformers, huggingface-hub, ...) that
          # this smoke test doesn't touch, to keep CI fast. Versions must
          # stay in sync with requirements.txt.
          pip install \
            "numpy>=1.26,<3" "pandas>=2.2" "scipy>=1.11" "scikit-learn>=1.3,<1.6" \
            "statsmodels>=0.14,<0.15" "patsy>=0.5" "factor-analyzer>=0.5" "semopy>=2.3" \
            "matplotlib>=3.8" "seaborn>=0.13" "openpyxl>=3.1" "PyYAML>=6.0"

      - name: Run quickstart pipeline on synthetic data
        run: ./code/score-transformation/run_all.sh

      - name: Upload quickstart output (for debugging failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickstart-output
          path: quickstart-output/
          retention-days: 7
          if-no-files-found: ignore
